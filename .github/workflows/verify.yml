name: Verify Code Escape

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AARAMBH_TEST_MEMORY_SERVER: ${{ github.workspace }}/server/node_modules/mongodb-memory-server
      MONGOMS_VERSION: '7.0.24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - name: Runtime dependency security audit
        run: npm audit --prefix server --omit=dev --audit-level=high
      - name: Client dependency security audit
        run: npm audit --prefix client --audit-level=high
      - name: Game rules, authentication and transfer tests
        run: npm test --prefix server
      - name: Actual HTTP workflow and authenticated spreadsheet export
        run: node server/scripts/strict-workflow-smoke.js
        env:
          GAME_SMOKE_REPORT: strict-workflow-report.json
      - name: Organizer authentication and booklet access controls
        run: node server/scripts/admin-security-smoke.js
      - name: Digital early rounds and isolated rehearsal workflows
        run: node server/scripts/early-round-workflow-smoke.js
      - name: Interactive puzzles and transactional question installation
        run: node server/scripts/interactive-workflow-smoke.js
        env:
          INTERACTIVE_SMOKE_REPORT: interactive-workflow-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-workflow-report
          path: |
            strict-workflow-report.json
            interactive-workflow-report.json
          if-no-files-found: ignore
      - name: Client state and import tests
        run: node --test client/tests/*.test.js
      - name: Production build
        run: npm run build
